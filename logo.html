<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴ案（10書体）｜有限会社K.OTSUKA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Cinzel:wght@500&family=Playfair+Display:wght@600&family=Bodoni+Moda:opsz,wght@6..96,500&family=Marcellus&family=EB+Garamond:wght@500&family=Libre+Caslon+Text&family=Italiana&family=Forum&family=Prata&family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1e25;--ink-2:#555860;--paper:#f6f2ea;--navy:#0f1d30;--gold:#b8955a;--gold-d:#8a6a35;--gold-l:#d6bd86}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--paper);line-height:1.8;letter-spacing:.04em;padding:clamp(32px,6vw,72px) 16px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-family:"Shippori Mincho",serif;font-weight:600;font-size:clamp(24px,3vw,34px);letter-spacing:.08em}
.lead{color:var(--ink-2);margin-top:12px;max-width:44em;font-size:15px}
.back{display:inline-block;margin-top:16px;font-size:14px;color:var(--gold-d);border-bottom:1px solid currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:24px;margin-top:40px}
.card{border:1px solid rgba(138,106,53,.25);background:#fffdf8;border-radius:4px;overflow:hidden}
.card.is-pick{outline:2px solid var(--gold);outline-offset:4px}
.sw{display:grid;grid-template-columns:1fr 1fr}
.sw > div{display:grid;place-items:center;min-height:150px;padding:20px 12px}
.sw .dk{background:var(--navy);color:var(--gold-l)}
.sw .lt{color:var(--navy)}
.logo{display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.logo svg{width:40px;height:40px;flex:none;color:var(--gold)}
.lt .logo svg{color:var(--gold-d)}
.logo span{display:grid;line-height:1}
.logo small{font-family:"Shippori Mincho",serif;font-weight:500;font-size:10px;letter-spacing:.32em;opacity:.8;margin-bottom:6px}
.logo b{font-weight:inherit;font-size:24px;letter-spacing:.14em}
.dk .logo b{color:#f3eee3}
.meta{padding:14px 18px;border-top:1px solid rgba(138,106,53,.18);font-size:13px;color:var(--ink-2)}
.meta strong{display:block;font-size:14px;color:var(--ink);font-weight:500}
.pick{display:inline-block;margin-left:8px;font-size:11px;color:#fff;background:var(--gold-d);padding:0 8px;border-radius:2px;vertical-align:2px}
@media (max-width:479px){.sw{grid-template-columns:1fr}.logo b{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ロゴ案 — 10書体の比較</h1>
  <p class="lead">シンボル（二重円に「K」）は共通で、社名の書体だけを変えた10案です。左が濃紺の背景、右が生成りの背景での見え方です。サイトには案07を採用しています。別の案に変える場合は、番号でお知らせください。</p>
  <a class="back" href="index.html">← サイトに戻る</a>
  <div class="grid" id="grid"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <circle cx="24" cy="24" r="19.6" fill="none" stroke="currentColor" stroke-width=".5"/>
    <g fill="none" stroke="currentColor" stroke-linecap="butt">
      <path d="M18 14.5V33.5" stroke-width="2.4"/>
      <path d="M19.2 25.2L29 14.5" stroke-width="1.1"/>
      <path d="M22.6 21.6L30.4 33.5" stroke-width="2.2"/>
      <path d="M15.4 14.5H20.8M15.4 33.5H20.8M26.4 14.5H31.6M27.8 33.5H33" stroke-width=".9"/>
    </g>
  </symbol>
</svg>
<script>
const FONTS = [
  ["Cormorant Garamond", 600, "端正で知的。細身のセリフで、落ち着いた品のよさが出ます。"],
  ["Cinzel", 500, "古代ローマの碑文がもと。すべて大文字の、格式と重厚感。"],
  ["Playfair Display", 600, "線の太い・細いがはっきり。雑誌のような華やかさ。"],
  ["Bodoni Moda", 500, "高級ブランドによく使われる、強いコントラストの書体。"],
  ["Marcellus", 400, "先端がやわらかく広がる形。上品さと親しみの中間。"],
  ["EB Garamond", 500, "伝統的なガラモン体。落ち着いた信頼感。"],
  ["Libre Caslon Text", 400, "書籍・新聞の本文書体。堅実で誠実な印象。", true],
  ["Italiana", 400, "細く伸びやか。ホテルやサロンのような軽やかさ。"],
  ["Forum", 400, "細身の碑文体。静かで控えめな格式。"],
  ["Prata", 400, "太めのディドーネ体。小さくしても存在感があります。"],
];
const logo = (f, w) => `<span class="logo" style="font-family:'${f}',serif;font-weight:${w}"><svg aria-hidden="true"><use href="#mark"/></svg><span><small>有限会社</small><b>K.OTSUKA</b></span></span>`;
document.getElementById("grid").innerHTML = FONTS.map(([f, w, d, pick], i) => `
  <article class="card${pick ? " is-pick" : ""}">
    <div class="sw"><div class="dk">${logo(f, w)}</div><div class="lt">${logo(f, w)}</div></div>
    <p class="meta"><strong>案${String(i + 1).padStart(2, "0")}　${f}${pick ? '<span class="pick">採用中</span>' : ""}</strong>${d}</p>
  </article>`).join("");
</script>
</body>
</html>
